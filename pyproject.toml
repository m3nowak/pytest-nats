[project]
name = "pytest-nats"
version = "0.1.0"
description = "Pytest helpers for running ad-hoc NATS servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.12.0",
    "platformdirs>=4.11.5",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.405",
    "pytest>=8.4.2",
    "ruff>=0.12.12",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-m", "not integration"]
markers = ["integration: uses real NATS providers and requires PYTEST_NATS_RUN_INTEGRATION=1"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
]
