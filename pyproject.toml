[project]
name = "pytest-nats"
dynamic = ["version"]
description = "Pytest helpers for running ad-hoc NATS servers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.12.0",
    "platformdirs>=4.11.5",
    "pytest>=8.4.2",
]

[project.urls]
Repository = "https://github.com/m3nowak/pytest-nats"
Issues = "https://github.com/m3nowak/pytest-nats/issues"

[build-system]
requires = ["pdm-backend>=2.4.0,<3"]
build-backend = "pdm.backend"

[tool.pdm.version]
source = "scm"
tag_filter = "v*"
fallback_version = "0.0.0"

[dependency-groups]
dev = [
    "nats-py>=2.11.0",
    "pyright>=1.1.405",
    "pytest-httpx2>=1.0.0",
    "ruff>=0.12.12",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-m", "not integration"]
markers = ["integration: uses real NATS providers and requires PYTEST_NATS_RUN_INTEGRATION=1"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
]
