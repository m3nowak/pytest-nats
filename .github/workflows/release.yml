name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: mise run setup
      - run: mise run test
      - run: mise run check
      - run: uv build
      - name: Verify release version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: ls "dist/pytest_nats-${TAG#v}-py3-none-any.whl" "dist/pytest_nats-${TAG#v}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytest-nats
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
